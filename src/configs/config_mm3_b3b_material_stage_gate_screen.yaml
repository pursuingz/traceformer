# B3b bounded material-stage gate screening.
# The B3a@90k backbone and shared adapter are frozen; only 3 x 4 gate logits train.
output_dir: ./outputs/mm3_b3b_material_stage_gate_screen
base_checkpoint: outputs/mm3_b3a_material_state_adapter_8L/checkpoint-90000/model.safetensors
seed: 0
mixed_precision: bf16
pc_size: 2048
input_frames: 5
output_frames: 1
use_diffusion: false

# Frozen calibration protocol. The 41-model mm3_test split is never read here.
gate_train_fraction: 0.8
gate_split_seed: 0
gate_start0_probability: 0.5
gate_max_rollout_steps: 20
gate_updates_per_material: 200
gate_validation_interval: 25
gate_patience: 3
gate_learning_rate: 3.0e-3
gate_long_weight: 0.5
gate_reg_weight: 1.0e-3
gate_batch_size: 1
gate_dataloader_num_workers: 4

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  gravity_emb: true
  coeff_cond: false
  num_mat: 4
  class_token: true
  transformer_block: SpatialTemporalTransformerBlock
  contact_particle_cond: true
  contact_feature_sigma: 0.04
  material_state_adapter: true
  material_state_rank: 64
  material_state_interval: 2
  material_state_e_center: 5.5
  material_state_e_scale: 1.0
  material_state_nu_center: 0.25
  material_state_nu_scale: 0.15
  material_state_runtime_scale: 1.0
  material_stage_gate: true
  material_stage_gate_max: 2.0

train_dataset:
  category: hf-objaverse-v1
  dataset_path: mm3_data/mm3_train
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: ${input_frames}
  output_frames: ${output_frames}
