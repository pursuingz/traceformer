# v11a MC-HST 8L 多材质候选,严格复制 config_mm3_singleframe_geom_deform_d0001.yaml。
# 相对该 mm3 baseline 仅改 output_dir、architecture selector,并新增 3 个 hybrid 参数:
# hybrid_state_dim=64 / hybrid_state_heads=4 / hybrid_state_interval=2。
# n_layers=8 保持 8 个原串行 block 不变;v11a 另加每 2 层交互一次的共享 hybrid-state exchange,
# 因此不是 run23 的同一架构。数据、采样、损失权重、步数、batch、lr、seed 与 split 均冻结。
# 对照 checkpoint 固定为双方 checkpoint-90000。
# 若服务器显存不足,不得仅为 v11a 启用 gradient checkpointing;须同时重训 baseline 形成新配对实验。
# ⚠️ step-2000 检查 loss_deform/xyz 比值仍落 0.1~0.5×(gating 后 loss_F 只作用 ~1/3 样本);漂出即重校 λ。
image_size: 128
output_dir: ./outputs/mm3_v11a_mc_hst_8L   # 改 1:独立目录(多材质臂)
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 90000        # 冻结 = elastic 对比锚点(数据 ×3 而步数不变 → 每物体见次 1/3,两臂同等,内部公平)
gradient_accumulation_steps: 8
gradient_checkpointing: true  # 冻结/继承 mm3 baseline;train.py enable 调用已注释,双方实际均走 non-checkpoint 路径
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 19
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 2000
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0          # output=1 下自动失效(train.py 守卫 pred.shape[1]>=2)
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.001     # 冻结 = SOTA:λ=0.001;经 geom_elastic_only 只作用 elastic 样本

single_frame_deform: true   # 冻结 = SOTA:单帧 boundary loss_F

geom_elastic_only: true  # 冻结/继承 mm3 baseline:多材质 gating,仅作用 elastic(mat_type==0)样本

lambda_laplacian: 0.5    # 冻结 = sfG(经 gating 仅 elastic)
lambda_collision: 0.1
lambda_edge: 1.0         # 冻结 = sfG(经 gating 仅 elastic)
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 2048
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true

output_frames: 1                # 冻结:单帧输出(input 仍 5)= sfG
rollout_random_window: true     # 冻结:随机窗口起点
windows_per_model: 20           # 冻结:每 model 20 个随机窗口/epoch

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: True
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  gravity_emb: true        # 冻结/继承 mm3 baseline:混合重力标志
  coeff_cond: false
  num_mat: 4               # 冻结/继承 mm3 baseline:材质类别数
  class_token: true        # 冻结/继承 mm3 baseline:材质类别 token
  transformer_block: SpatialTemporalTransformerBlockv11a   # 8 个原串行 block 不变;新增共享 exchange
  hybrid_state_dim: 64
  hybrid_state_heads: 4
  hybrid_state_interval: 2
train_dataset:
  category: hf-objaverse-v1
  dataset_path: mm3_data/mm3_train   # 冻结/继承 mm3 baseline:多材质训练集
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: 'deform'
  mode: 'diff'
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
