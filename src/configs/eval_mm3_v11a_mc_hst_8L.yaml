# Eval config for 多材质臂 A(mm3,sfG + loss_F 单帧 AR)。
# 严格镜像 config_mm3_singleframe_geom_deform_d0001.yaml 的 model_config 与 train_dataset,
# 只差 resume / vis_dir / split(_test 结尾 → traj_dataset 取全部当 test split,41 h5 = elastic 13 + plasticine 14 + sand 14,split 见 configs/mm3_test_split.json)。
# eval.py 自动输出 per-material 分组(elastic/plasticine/sand 各一段;跨材质单标量禁止)。
# 对照臂 = eval_mm3_physctrl_orig.yaml(同 checkpoint-90000)。
pc_size: 2048
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:eval 逐帧滑动 rollout(input 仍 5)

resume: 'outputs/mm3_v11a_mc_hst_8L/checkpoint-90000/model.safetensors'
vis_dir: 'vis_results_mm3_v11a_mc_hst_8L'
per_model_csv: true   # 按模型 CSV(含 mat_type/fde/mse_f24/resid_f24 列,供长尾与分材质分析)

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  gravity_emb: true        # 镜像训练 config
  coeff_cond: false
  num_mat: 4               # 镜像训练 config
  class_token: true        # 镜像训练 config
  transformer_block: SpatialTemporalTransformerBlockv11a
  hybrid_state_dim: 64
  hybrid_state_heads: 4
  hybrid_state_interval: 2

train_dataset:
  category: hf-objaverse-v1
  dataset_path: mm3_data/mm3_test   # 多材质测试集(41 h5 = 13+14+14,held-out 物体,各材质 uid 不同段)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 2048
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
