# Eval for the low-lr K=2 rollout fine-tune of run23@60k. Mirrors eval_23.yaml exactly
# (same run23 inference path: use_diffusion=false, 1-step, v1 serial, data_test n=14),
# changing only resume / vis_dir. The fine-tune's own checkpoint-60000 = run23@60k + 60k K=2 FT.
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1

resume: 'outputs/v1_ft_rollout_k2_lowlr/checkpoint-60000/model.safetensors'
vis_dir: 'vis_results_v1_ft_rollout_k2'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: data_test
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 5
