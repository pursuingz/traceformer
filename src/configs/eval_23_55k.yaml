# run23 baseline @ checkpoint-55000(仅为与 1b@55000 同 step 对比而存在)。
# 与 eval_23.yaml 逐字段相同,只差 resume 的 step / vis_dir。
# eval_23.yaml 保持指向 45000(A2 的锚点),不要动它。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1

resume: '23(sota)/checkpoint-55000/model.safetensors'
vis_dir: 'vis_results_23_55k'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 5
