# 时间感受野消融:输入历史 5 帧 → 1 帧。基于 config_v1_singleframe_geom_deform_d0001.yaml(当前 SOTA)。
# 问题:在 (位置, 速度 start_vel) 之上,5 帧历史(加速度/形变趋势)还带不带信息?
# 唯一变量(vs SOTA):input_frames 5→1(+ 必需的 causal_start_vel,否则 input=1 时 start_vel 中心差分偷看目标帧)。
# 改 3 处:1. 顶层 input_frames: 1(config 驱动 INPUT_FRAMES,建模 cond_frames=1);
#         2. train_dataset.causal_start_vel: true(Blocker 1:后向差分,不偷看 x[start_idx+1]=目标);
#         3. output_dir(独立目录,防 resume 污染)。其余全冻结 = SOTA。
# ⚠️ 混淆项:SOTA 用中心差分 start_vel、本臂用后向差分。但 input=5 有 5 帧历史使 start_vel 近乎冗余 → 可忽略。
image_size: 128
output_dir: ./outputs/singleframe_geom_deform_d0001_input1_8L   # 改 3:独立目录(input=1 臂)
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 60000
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 10
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0          # output=1 下自动失效(train.py 守卫 pred.shape[1]>=2)
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.001     # 冻结 = SOTA:λ=0.001 拐点

single_frame_deform: true   # 冻结 = SOTA:单帧 boundary loss_F

lambda_laplacian: 0.5    # 冻结 = sfG
lambda_collision: 0.1
lambda_edge: 1.0         # 冻结 = sfG
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 512
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true

input_frames: 1                 # 改 1:输入历史 5→1(config 驱动 INPUT_FRAMES → dataset + cond_frames=1)
output_frames: 1                # 冻结:单帧输出 = SOTA
rollout_random_window: true     # 冻结:随机窗口起点
windows_per_model: 20           # 冻结:每 model 20 个随机窗口/epoch

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: True
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock   # 冻结:与 run23 同架构(串行)
train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true # no gravity
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: 'deform'
  mode: 'diff'
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  causal_start_vel: true   # 改 2(Blocker 1 必需):start_vel 后向差分,input=1 下不偷看目标帧
