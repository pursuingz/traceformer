# 诊断用 eval config:严格复制 eval_mm3_singleframe_geom_deform_d0001.yaml(同 checkpoint,
# 同 resume/model_config/train_dataset),只加一处 floor_projection: true。
# 目的:验证 sf 族"地面穿透"(见实验记录.md / physctrl2-mm3-experiment memory)是否是
# rollout 主要瓶颈——推理时把预测里 y<floor_height 的点直接夹回地板,不碰训练/loss,只在
# eval.py 的 rollout 反馈路径生效(见 eval.py floor_projection 分支)。
# 对照 = eval_mm3_singleframe_geom_deform_d0001.yaml(不开 floor_projection,其余全同)。
pc_size: 2048
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:eval 逐帧滑动 rollout(input 仍 5)

resume: 'outputs/mm3_singleframe_geom_deform_d0001_8L/checkpoint-90000/model.safetensors'
vis_dir: 'vis_results_mm3_singleframe_geom_deform_d0001_floorproj'
per_model_csv: true   # 按模型 CSV,和无 clamp 版本逐模型对比

floor_projection: true   # ★ 唯一改动:推理时地板投影

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  gravity_emb: true        # 镜像训练 config
  coeff_cond: false
  num_mat: 4               # 镜像训练 config
  class_token: true        # 镜像训练 config
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: mm3_data/mm3_test   # 多材质测试集(41 h5 = 13+14+14,held-out 物体,各材质 uid 不同段)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 2048
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
