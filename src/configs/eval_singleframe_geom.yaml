# Eval config for 单帧 + 几何正则臂。镜像 eval_singleframe_randwin.yaml,只改 resume / vis_dir。
# 几何损失是训练项,eval 不算;但 eval 照常输出 full-rollout / 体积自漂移 / 穿透 → 直接看疗效。
# 主判据 = full-rollout(守住 ≤ run23 5.019e-3?)+ 体积自漂移(目标 → 接近 run23 8.7% 或更低)。
#   对照 singleframe 基线(full-rollout 4.532e-3 / 体积自漂移 14.742%)+ run23(5.019e-3 / 8.716%)。
# first-chunk / chunk per-step 在 output=1 不可比,台账不用(同 singleframe)。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:驱动模型重建 + eval 逐帧滑动 rollout

resume: 'outputs/singleframe_geom_8L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_singleframe_geom'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: data_test   # n=14 held-out 同口径
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
