# Based on config_v6_local_global_8L.yaml. Keep aug6win aug + local kNN; change only:
#   1. output_dir
#   2. model_config.transformer_block: v6 -> v6b (strain-gated local message)
# v6b = v6 + per-node strain gate on the local kNN message. Gate driven by edge-length
# change rate ê·Δv (rotation/translation-invariant, = 0 under rigid motion), so the local
# message vanishes in tumbling/static regions (fixes v6's start=0 full-rollout regression)
# and only fires where the neighbourhood actually deforms (keeps the start>0 gain).
# num_neighbors=16 (drives both the kNN message and the strain features). init == v1 (local_gate zero-init).
image_size: 128
output_dir: ./outputs/v6b_strain_gated_8L            # 改 1:独立目录
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 60000
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 10
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.1

lambda_laplacian: 0
lambda_collision: 0.1
lambda_edge: 0
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 512
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true

train_extra_random_windows: 2                        # 同 v6:保留 aug6win 叠加增强

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: 16
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlockv6b   # 改 2:strain-gated 局部消息

train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
