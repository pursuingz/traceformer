# Phase 4 — 改良并行 v5:S-F-T 流 与 T-F-S 流 并行,4 层。
# 基于 config_dit_base.yaml(= run23),相对 run23 仅改 3 处(A2 式公平对照,唯一变量=架构):
#   1. model_config.transformer_block: SpatialTemporalTransformerBlock -> SpatialTemporalTransformerBlockv5
#   2. model_config.n_layers: 8 -> 4(等参对齐点:v5 单块≈2x v1 串行块 → v5-4L ≈ v1-8L = run23 16.09M)
#   3. output_dir(独立目录)
# 设计:每块并联两条各自完整、轴序相反的串行流(流A=S->F->T=v1块;流B=T->F->S),
#   各自相对输入的增量经 fuse 投影合并。针对 A2「串行(单一轴序)>并行(无块内跨轴流)」:
#   v5 既保留串行块内跨轴流,又补「轴序对称」。检验能否在等参下追平并反超 run23。
# 数据 / 损失权重 / 步数 / batch / lr / val split 全部冻结 = run23。
image_size: 128
output_dir: ./outputs/v5_4L                  # 改 3:独立目录
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 60000
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 10
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.1

lambda_laplacian: 0
lambda_collision: 0.1
lambda_edge: 0
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 512
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true
model_config:
  n_layers: 4                                 # 改 2:等参对齐 run23(v5 单块≈2x v1)
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: True
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlockv5   # 改 1:并行双向串行块
train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true # no gravity
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: 'deform'
  mode: 'diff'
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
