# Eval mirror for config_mm3_contact_vxyz.yaml at checkpoint 45000.
pc_size: 2048
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1

resume: 'outputs/mm3_contact_vxyz_8L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_mm3_contact_vxyz_45k'
per_model_csv: true

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  gravity_emb: true
  coeff_cond: false
  num_mat: 4
  class_token: true
  transformer_block: SpatialTemporalTransformerBlock
  contact_particle_cond: true
  contact_feature_sigma: 0.04
  contact_velocity_mode: xyz

train_dataset:
  category: hf-objaverse-v1
  dataset_path: mm3_data/mm3_test
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 2048
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
