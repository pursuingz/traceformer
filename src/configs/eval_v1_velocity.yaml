# Eval config for Phase 2(速度/逐帧积分预测,串行 8L)。
# 镜像 eval_23.yaml,只改 resume / vis_dir,并加 model_config.pred_velocity: true(必须与训练一致,
# 否则 forward 重构方式不同 = 分布错位)。eval 推理路径仍同 run23(use_diffusion=false, 1 step)。
# 与 run23 同 step 对比(eval_23_55k.yaml = 55000)。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1

resume: 'outputs/velocity_v1_8L/checkpoint-55000/model.safetensors'
vis_dir: 'vis_results_velocity_v1'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  pred_velocity: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 5
