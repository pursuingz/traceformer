# Eval config for Phase 2(速度/逐帧积分预测,串行 8L)。
# 镜像 eval_23.yaml,只改 resume / vis_dir,并加 model_config.pred_velocity: true(必须与训练一致,
# 否则 forward 重构方式不同 = 分布错位)。eval 推理路径仍同 run23(use_diffusion=false, 1 step)。
# 2026-06-23 切到 n=14 口径:checkpoint 55000→45000(对齐 n=14 表所有臂的锚点,run23 n=14 基线
# 只有 @45000)、dataset_path site→data_test(14-model held-out)。旧 @55000/n=4 结果作废,见实验记录.md §5。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1

resume: 'outputs/velocity_v1_8L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_velocity_v1_n14'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  pred_velocity: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: data_test            # n=14 held-out（同分布，训练全未见）；_test 结尾→走 [:100] 全用
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 5
