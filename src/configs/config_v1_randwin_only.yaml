# 析因消融 臂(10):随机窗口单步 —— 隔离「随机窗口数据增强」单独的边际贡献。
# 基于 config_dit_base.yaml(= run23 串行 8L),相对 run23 仅改 / 加 3 处:
#   1. output_dir(独立目录)
#   2. rollout_random_window: true  —— 训练窗口起点在 [0, max_start] 连续随机(数据增强)
#   3. rollout_unroll_steps: 1       —— 显式声明仍是纯单步,不开 rollout / curriculum / DAgger
# 与 run23 的【唯一差别 = 训练窗口起点 stride-5 固定 → 全轨迹随机】。
#   curriculum 关闭(无 rollout_curriculum)→ train.py 不重建 loader、rollout 段不触发;
#   windows_per_model 不设 → dataset 回退 stride-5 计数(每 model 4 窗口),epoch 规模 = run23。
# 架构 / 数据 / 损失权重(含为 0 的)/ 步数 / batch / lr 全部冻结 = run23。
image_size: 128
output_dir: ./outputs/ablation_randwin_only_8L          # 改 1:独立目录
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 60000
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 10
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.1

lambda_laplacian: 0
lambda_collision: 0.1
lambda_edge: 0
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 512
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true

# 改 2 / 3:仅开随机窗口,显式保持单步(不开 rollout / curriculum)
rollout_random_window: true        # 改 2:窗口起点全轨迹随机(唯一变量)
rollout_unroll_steps: 1            # 改 3:显式声明纯单步(默认即 1,写出来防混淆)

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: True
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock   # 冻结:与 run23 同架构(串行)
train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true # no gravity
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: 'deform'
  mode: 'diff'
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
