# diff_E_2048 数据集(2048 粒子)上的 sfG + boundary loss_F(λ_deform=0.001)训练。
# 完全复制 config_diffE_singleframe_geom_deform_d0001.yaml(diffE-512 臂),唯一变量 = 粒子数:
#   512 → 2048(数据生成 N=2048,commit 85e2d6b;h5 存 2048 粒子,pc_size=2048 → dataset 全量使用不降采样)。
# 目的:检验空间采样密度对单步映射/rollout 的影响。对照臂 = diffE-512(full-rollout 3.047e-3 @45k)。
# 改 3 处(相对 diffE-512 config):
#   1. output_dir(独立目录,防 resume 污染)
#   2. pc_size 512 → 2048(train_dataset.pc_size 经 ${pc_size} 自动跟随)
#   3. train_dataset.dataset_path: diff_E_data/diff_E_train → diff_E_2048_data/2048_data/2048_train
#   (方法/损失/步数/lr/split/E-nu 随机化全部冻结 = diffE-512 臂)
# ⚠️ 已知混淆:2048 数据生成用了 uid 索引 30xxx 段(254 train/13 test),与 diffE-512 的 20xxx/25xxx
#    段物体集零重叠 → 与 diffE-512 跨臂比数字带「物体集不同」混淆(同 site-vs-20xxx caveat)。
#    干净对照 = 同 30xxx 数据再训一个 pc_size=512 臂(降采样路径),唯一变量才是采样密度。
# ⚠️ 模型参数量不变(位置嵌入是 sincos buffer,非学习参数),但空间注意力 O(N²) → 计算 ~16×,
#    显存/单步耗时显著上升;grad ckpt + xformers 已开。若 OOM 先降 dataloader_num_workers。
# ⚠️ 指标口径:MSE 是逐点均值、量纲可比,但 Chamfer/凸包体积随采样密度移动,跨 N 对比需谨慎。
image_size: 128
output_dir: ./outputs/diffE2048_singleframe_geom_deform_d0001_8L   # 改 1:独立目录(2048 粒子臂)
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 90000        # 60000 → 90000(2048 臂延长训练;⚠️ 与 diffE-512 跨臂比须取同 step checkpoint)
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 19   # 10 → 19:90000 步下保住 checkpoint-45000(eval 对比点),否则被轮转删除
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 2000       # 500 → 2000(2048 粒子 val 前向贵 16×,降频省时)
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0          # output=1 下自动失效(train.py 守卫 pred.shape[1]>=2)
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.001     # 冻结 = SOTA:λ=0.001 命中拐点

single_frame_deform: true   # 冻结 = SOTA:开启单帧 boundary loss_F

lambda_laplacian: 0.5    # 冻结 = sfG:曲面平滑正则
lambda_collision: 0.1
lambda_edge: 1.0         # 冻结 = sfG:边长保持正则
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 2048            # 改 2:512 → 2048(唯一实验变量;数据 h5 即 2048 粒子,全量使用)
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true

output_frames: 1                # 冻结:单帧输出(input 仍 5)= sfG
rollout_random_window: true     # 冻结:随机窗口起点
windows_per_model: 20           # 冻结:每 model 20 个随机窗口/epoch

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: True
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock   # 冻结:与 run23 同架构(串行)
train_dataset:
  category: hf-objaverse-v1
  dataset_path: diff_E_2048_data/2048_data/2048_train   # 改 3:2048 粒子训练集(E/nu 随机;uid 30xxx 段,254 条)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true # no gravity
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: 'deform'
  mode: 'diff'
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
