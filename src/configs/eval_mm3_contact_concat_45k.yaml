# Contact Shared Encoder 的 45k screening 评测配置。
# 严格镜像 config_mm3_contact_concat.yaml 的 model_config 与 train_dataset。
# train_dataset 仅切换到 mm3_test，并显式提供 eval runtime 所需的输入/输出帧数；
# resume 指向 checkpoint-45000，vis_dir 使用独立目录。
pc_size: 2048
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:eval 逐帧滑动 rollout(input 仍 5)

resume: 'outputs/mm3_contact_concat_8L/checkpoint-45000/model.safetensors'  # shared screening 检查点
vis_dir: 'vis_results_mm3_contact_concat_45k'
per_model_csv: true   # 按模型 CSV(含 mat_type/fde/mse_f24/resid_f24 列,供长尾与分材质分析)

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  gravity_emb: true        # 镜像训练 config
  coeff_cond: false
  num_mat: 4               # 镜像训练 config
  class_token: true        # 镜像训练 config
  transformer_block: SpatialTemporalTransformerBlock
  contact_particle_cond: true
  contact_injection_mode: shared  # 镜像训练配置的 shared 注入模式
  contact_feature_sigma: 0.04

train_dataset:
  category: hf-objaverse-v1
  dataset_path: mm3_data/mm3_test   # 多材质测试集(41 h5 = 13+14+14,held-out 物体,各材质 uid 不同段)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 2048
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
