# Eval config for Phase 4 v5-4L(并行双向串行块)。镜像 config_v5_4L.yaml 的 model_config,
# 只改 resume / vis_dir / dataset_path(指 n=14 held-out data_test,与 run23 同口径)。
# eval 推理路径同 run23:use_diffusion=false, 1 step。与 run23@45000(data_test n=14)对照。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1

resume: 'outputs/v5_4L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_v5_4L'

model_config:
  n_layers: 4
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlockv5

train_dataset:
  category: hf-objaverse-v1
  dataset_path: data_test   # n=14 held-out 同口径
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 5
