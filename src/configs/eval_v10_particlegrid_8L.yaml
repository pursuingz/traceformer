# Eval config for v10 particle-grid 块。镜像 eval_singleframe_geom_deform_d0001.yaml,
# 只改 resume / vis_dir / transformer_block(+ grid_res)。判据 vs sfG+loss_F λ=0.001
#   (full-rollout 2.978e-3 / 体积超额 +5.63%):
#   full-rollout ≲ 2.978e-3 且 体积超额 < +5.63% → grid 中尺度连续性在 SOTA 之上有净增量。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:驱动模型重建 + eval 逐帧滑动 rollout

resume: 'outputs/v10_particlegrid_8L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_v10_particlegrid'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlockv10
  grid_res: 8

train_dataset:
  category: hf-objaverse-v1
  dataset_path: data_test   # n=14 held-out 同口径
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
