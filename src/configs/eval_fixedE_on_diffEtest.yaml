# 交叉对照 arm2:固定 E(=1e6)训的 SOTA 模型 → 评 diff_E_test(随机 E)。
# 镜像 eval_singleframe_geom_deform_d0001.yaml(resume 仍是固定 E SOTA 权重),只改 dataset_path / vis_dir / per_model_csv。
# 与 arm1(diff_E→diff_E,full-rollout 2.851e-3)同评测集(diff_E_test)→ 可直接比:
#   arm2 明显更差 = 固定 E 训练泛化不到随机 E(尤其 8 个软材料);打平 = E 多样化训练无增益。
# ⚠️ diff_E_test 偏软(8/11 log10E≤5.76),训练点 1e6 落在空档 → 预期 arm2 在软档吃亏。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1

resume: 'outputs/singleframe_geom_deform_d0001_8L/checkpoint-45000/model.safetensors'   # 固定 E SOTA 权重(不变)
vis_dir: 'vis_results_fixedE_on_diffEtest'
per_model_csv: true   # dump 按模型 CSV(供 E 分档)

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: diff_E_data/diff_E_test   # 改:评测集 = diff_E_test(与 arm1 同口径)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
