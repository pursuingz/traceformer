# mm1_contact_cond 的 checkpoint-45000 评测配置。
# 模型与数据字段严格镜像 config_mm1_contact_cond.yaml；
# 测试集保持 diff_E_2048_data/2048_data/2048_test。
# Eval config for diff_E_2048 臂(2048 粒子,sfG + boundary loss_F λ_deform=0.001)。
# 严格镜像 config_diffE2048_singleframe_geom_deform_d0001.yaml 的 model_config 与 train_dataset,
# 只差 resume / vis_dir / split(eval.py 强制 'val')。
# 评测集 = diff_E_2048_data/2048_data/2048_test(_test 结尾 → traj_dataset 取全部当 test split,n=13)。
# ⚠️ 物体集 = uid 39xxx 段,与 diff_E_test(25xxx)零重叠 → 跨臂比 diffE-512 带物体集混淆。
# 对照臂 = diffE-512(eval_diffE_singleframe_geom_deform_d0001,full-rollout 3.047e-3 @45k)。
# ⚠️ MSE 逐点均值跨 N 大致可比;Chamfer/凸包体积随采样密度移动,对比时注明口径。
pc_size: 2048
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:驱动模型重建 + eval 逐帧滑动 rollout

resume: 'outputs/mm1_contact_cond_8L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_mm1_contact_cond_45k'
per_model_csv: true   # dump 按模型 CSV(供 E 分档拆解;additive,不改聚合指标)

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock
  contact_particle_cond: true
  contact_injection_mode: separate
  contact_velocity_mode: vertical
  contact_feature_sigma: 0.04

train_dataset:
  category: hf-objaverse-v1
  dataset_path: diff_E_2048_data/2048_data/2048_test   # 2048 粒子测试集(_test 结尾 → 取全部 13 条)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 2048
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
