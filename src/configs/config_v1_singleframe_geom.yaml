# 单帧自回归 + 几何正则臂。基于 config_v1_singleframe_randwin.yaml(架构=run23 串行 v1 8L)。
# 动机:singleframe 臂 full-rollout MSE 赢(-9.7% vs run23)但体积自漂移 14.7%(+69%)、视觉更差。
#   full-rollout 是逐点 MSE 均值,只奖励平均位置,对局部几何/体积不敏感。laplacian(局部曲面形状)
#   + edge(邻居间距=局部体积/拉伸代理)是空间正则,output=1 完全可定义(不像 vel/deform 多帧失效),
#   且参考系是 GT(points_tgt)→ GT 监督的几何一致性,不是刚体先验,只把梯度重聚焦到局部几何。
#   假设:单步几何更准 → 按「单步质量→rollout 质量」机制,rollout 体积漂移减慢。
# 相对 singleframe 基线改 / 加 3 处(唯一变量 = 几何 lambda):
#   1. output_dir(独立目录)
#   2. lambda_edge: 1.0(原 0)—— 边长保持,体积/拉伸直接杠杆,主打。
#   3. lambda_laplacian: 0.5(原 0)—— 曲面平滑,视觉,辅。
# ⚠️ lambda 为初值,step-2000 看 loss_edge/loss_laplacian 量级 vs loss_xyz(≈2e-5)校准:
#   加权项落 xyz 的 0.1~0.5× 为宜(够纠偏、不压过位置主损失);偏离则调 lambda 重启。
# 其余(output_frames=1 / 随机窗口 / windows_per_model=20 / 架构 / 数据 / 步数 / batch / lr / split)
#   严格冻结 = singleframe 基线 = run23。lambda_vel/deform 在 output=1 仍自动失效(train.py 守卫)。
image_size: 128
output_dir: ./outputs/singleframe_geom_8L   # 改 1:独立目录
seed: 0
train_batch_size: 1
eval_batch_size: 1
num_train_epochs: 50
max_train_steps: 60000
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1e-4
scale_lr: false
lr_scheduler: "costant_with_warmup"
lr_warmup_steps: 100
use_8bit_adam: false
allow_tf32: true
dataloader_num_workers: 16
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
prediction_type: null
vis_dir: vis
logging_dir: logs
mixed_precision: 'bf16'
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 2500
checkpoints_total_limit: 10
resume_from_checkpoint: latest
enable_xformers_memory_efficient_attention: true
validation_steps: 500
validation_train_steps: 2000
validation_sanity_check: true
tracker_project_name: 'diffusion'
push_to_hub: false
set_grads_to_none: true
lambda_vel: 1.0          # output=1 下自动失效(train.py 守卫 pred.shape[1]>=2)
lambda_mask: 0.0
lambda_momentum: 0.0
lambda_deform: 0.1       # output=1 下自动跳过(train.py 守卫 pred.shape[1]>=3)

lambda_laplacian: 0.5    # 改 3:曲面平滑正则(原 0;单帧可定义,GT 监督)
lambda_collision: 0.1
lambda_edge: 1.0         # 改 2:边长保持正则(原 0;体积/拉伸杠杆,主打)
lambda_floor: 0.1
laplacian_k: 8
collision_margin: 0.01
pc_size: 512
condition_drop_rate: 0.0
model_type: 'dit_st'
pred_offset: true

output_frames: 1                # 冻结:单帧输出(input 仍 5)= singleframe 基线
rollout_random_window: true     # 冻结:随机窗口起点(output=1 必要配套)
windows_per_model: 20           # 冻结:每 model 20 个随机窗口/epoch

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: True
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock   # 冻结:与 run23 同架构(串行)
train_dataset:
  category: hf-objaverse-v1
  dataset_path: site
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true # no gravity
  max_num_forces: ${model_config.max_num_forces}
  norm_fac: 5
  stage: 'deform'
  mode: 'diff'
  pc_size: ${pc_size}
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
