# Eval config for diff_E 臂(sfG + boundary loss_F λ_deform=0.001,训练于 diff_E_train)。
# 镜像 eval_singleframe_geom_deform_d0001.yaml,只改 resume / vis_dir / dataset_path。
# 评测集 = diff_E_data/diff_E_test(11 个 elastic,E~U(4,7);ID 25xxx 与 train 20xxx 不相交)。
#   路径以 _test 结尾 → traj_dataset.py line 54 自动取全部 11 个当 test split。
# ⚠️ 数字不与项目历史 SOTA(data_test 上 full-rollout 2.978e-3)直接可比:评测集不同。
pc_size: 512
eval_batch_size: 1
dataloader_num_workers: 4
seed: 0
pred_offset: true
model_type: 'dit_st'

use_diffusion: false
num_inference_steps: 1
output_frames: 1          # 单帧输出:驱动模型重建 + eval 逐帧滑动 rollout

resume: 'outputs/diffE_singleframe_geom_deform_d0001_8L/checkpoint-45000/model.safetensors'
vis_dir: 'vis_results_diffE_singleframe_geom_deform_d0001'

model_config:
  n_layers: 8
  latent_dim: 256
  frame_cond: true
  point_embed: true
  mask_cond: true
  pred_offset: true
  num_neighbors: -1
  floor_cond: true
  max_num_forces: 1
  force_as_token: false
  force_as_latent: false
  coeff_cond: false
  class_token: false
  transformer_block: SpatialTemporalTransformerBlock

train_dataset:
  category: hf-objaverse-v1
  dataset_path: diff_E_data/diff_E_test   # diff_E 测试集(_test 结尾 → 取全部 11 个)
  dataset_list: DATASET_ITEM_LIST
  has_gravity: true
  max_num_forces: 1
  norm_fac: 5
  stage: deform
  mode: diff
  pc_size: 512
  repeat: 1
  seed: 0
  n_sample_pro_model: 300
  n_frames_interval: 1
  n_training_frames: 24
  batch_size: 20
  overfit: false
  input_frames: 5
  output_frames: 1
